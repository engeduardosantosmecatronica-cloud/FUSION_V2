  timeframe_default: "M5"  # timeframe padrao do sistema
  symbol_mapping:  # mapeamento simbolo sistema -> simbolo corretora
    GOLD: "GOLD"  # parametro de configuracao: GOLD
    SILVER: "XAGUSD"  # parametro de configuracao: SILVER
  # Overrides opcionais por ativo/broker. Se vazio, usa mt5.symbol_info(symbol).point.
  point_values: {}  # parametro de configuracao: point_values

# Model Settings
model:  # arquivos e features do modelo global
  model_dir: "./models"  # diretorio dos modelos principais
  global_model: "genesis_global_model.pkl"  # arquivo do modelo global
  scaler: "genesis_scaler.pkl"  # arquivo do scaler do modelo
  meta: "genesis_model_meta.pkl"  # metadados do modelo
  feature_columns:  # colunas de features usadas pelo modelo
    - "rsi_m5"  # item monitorado/permitido nesta lista
    - "rsi_m15"  # item monitorado/permitido nesta lista
    - "rsi_m30"  # item monitorado/permitido nesta lista
    - "rsi_h1"  # item monitorado/permitido nesta lista
    - "rsi_h4"  # item monitorado/permitido nesta lista
    - "rsi_d1"  # item monitorado/permitido nesta lista
    - "dist_ema_m5"  # item monitorado/permitido nesta lista
    - "dist_ema_m15"  # item monitorado/permitido nesta lista
    - "dist_ema_m30"  # item monitorado/permitido nesta lista
    - "dist_ema_h1"  # item monitorado/permitido nesta lista
    - "alpha_vam_m5"  # item monitorado/permitido nesta lista
    - "alpha_vam_h1"  # item monitorado/permitido nesta lista
    - "alpha_vam_d1"  # item monitorado/permitido nesta lista
    - "trend_alignment"  # item monitorado/permitido nesta lista

# Logging
logging:  # configuracao de logs
  level: "INFO"  # nivel minimo de log em arquivo
  # Console fica limpo; o arquivo continua recebendo INFO/DEBUG.
  console_level: "INFO"  # nivel minimo mostrado no console
  log_dir: "./logs"  # diretorio de log especifico
  max_file_size: 10485760  # tamanho maximo do arquivo de log em bytes
  backup_count: 5  # quantidade de backups de log rotacionados

# MT5 Signal Panel
mt5_signal_panel:
  enabled: true
  use_common_files: true
  output_dir: null
  file_prefix: "fusion_signal_panel_"
  refined_display:
    enabled: true
    show_final_row: true
    require_operational_matrix: true
    matrix_path: "reports/operational_target_matrix/operational_target_matrix_latest.json"
    min_samples: 10
    require_recommended: true
    block_on_missing_matrix: false
    block_on_low_samples: false
    block_on_missing_target_plan: false
    keep_raw_reason: true

mt5_trade_zones:
  enabled: true
  use_common_files: true
  output_dir: null
  file_prefix: "fusion_trade_zones_"
  bars: 120
  sr_lookback: 40
  atr_period: 14
  entry_atr_width: 0.15
  sr_atr_width: 0.08
  sl_atr_multiplier: 1.2
  tp_r_multiple: 2.0

mt5_decision_layers:
  enabled: true
  use_common_files: true
  output_dir: null
  file_prefix: "fusion_decision_layers_"

