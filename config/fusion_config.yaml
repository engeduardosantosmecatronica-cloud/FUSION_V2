# FUSION_V2 - Configuration File

# Broker Settings
broker:  # configuracoes de conexao com a corretora/MT5
  terminal_path: "E:\\Program Files\\MetaTrader 5\\terminal64.exe"  # caminho do executavel do MetaTrader 5
  login: 0  # login da conta; 0 usa conta ja conectada no terminal
  password: ""  # senha da conta; vazio evita gravar credencial
  server: ""  # servidor da corretora; vazio usa configuracao atual do MT5
  startup_timeout: 30  # tempo maximo para iniciar/conectar ao MT5 em segundos

# Risk Management
risk:  # parametros globais de risco e lote
  max_risk_per_trade: 0.25  # risco maximo por trade em porcentagem
  max_daily_loss: 2.0  # perda diaria maxima permitida em porcentagem
  max_positions: 1  # regra operacional: no maximo 1 ordem por ativo; nao usar limite global 4/50
  lot_step: 0.01  # incremento minimo de lote permitido
  min_lot: 0.01  # menor lote aceito
  max_lot: 0.01  # maior lote aceito
  default_sl_points: 100  # stop loss padrao em pontos quando nao houver regra especifica

# Trading Control
trading:  # controles gerais de abertura e limite de ordens
  allow_new_orders: true  # true permite novas ordens; false bloqueia novas entradas
  execution_mode: "automatic"  # fallback se a EA nao publicar fusion_execution_control.csv
  # mt5_execution_control removido: o sistema nao depende mais do bridge/CSV para liberar ordens.
  manual_approval:
    enabled: false
    request_file: "fusion_manual_order_request.csv"
    response_file: "fusion_manual_order_response.csv"
    timeout_seconds: 45
  floating_loss_guard:
    enabled: true
    max_loss_money: 50.0
    scope: "all_open_positions"
  daily_loss_guard:
    enabled: true
    max_loss_pct: 2.0
    max_loss_money: 50.0
    include_commission_swap: true
  reentry_cooldown_after_close:  # secao de configuracao: reentry_cooldown_after_close
    enabled: true  # liga/desliga esta camada ou recurso
    seconds: 180  # duracao em segundos
    scope: "system_symbol"  # escopo usado pela regra
  position_limits:  # secao de configuracao: position_limits
    enabled: true  # liga/desliga esta camada ou recurso
    # strategy: 1 ordem por ativo para cada estrategia.
    # system: 1 ordem por ativo no sistema inteiro, independente da estrategia.
    scope: "system"  # escopo usado pela regra
    max_per_symbol: 1  # limite por ativo/simbolo
    # any_direction: compra ou venda contam como posicao aberta no ativo.
    # by_direction: compra e venda contam separadas.
    mode: "any_direction"  # modo de operacao do filtro: shadow registra, block bloqueia

# Dashboard
dashboard:  # opcoes do dashboard textual do robo
  show_reason_column: true  # mostra coluna de motivos no dashboard
  show_reason_details: false  # mostra detalhes extensos dos motivos
  show_reason_summary: true  # mostra resumo agregado dos motivos
  show_neutral_details: false  # mostra detalhes de sinais neutros
  show_data_quality_details: false  # mostra detalhes de dados ausentes, features ou experts indisponiveis
  show_market_structure_shadow: false  # mostra diagnostico shadow de estrutura
  max_reason_items: 2  # quantidade maxima de motivos por linha
  max_summary_items: 6  # quantidade maxima de itens no resumo

# Event Bus / Structured Events
event_bus:  # configuracoes do barramento interno de eventos
  event_log_enabled: true  # grava eventos estruturados em JSONL
  event_log_dir: "logs/events"  # diretorio dos logs de eventos
  use_async: true  # usa fila assincrona para gravar eventos
  async_stop_timeout: 10  # timeout para encerrar fila assincrona
  log_engine_results: true  # grava resultados das engines
  log_tick_updates: false  # grava eventos de tick; pode gerar muito volume

# Currency Strength Map
currency_strength_map:  # mapa de forca relativa gerado a partir das previsoes atuais do Fusion
  enabled: true  # grava ranking por moeda e score por ativo para diagnostico quantitativo
  output_dir: "reports/currency_strength"  # pasta dos CSVs e snapshot JSON
  write_csv: true  # grava currency_strength_YYYYMMDD.csv e pair_strength_YYYYMMDD.csv
  write_json: true  # grava currency_strength_latest.json com o ultimo snapshot completo
  wait_edge: 0.08  # diferenca minima entre p_buy e p_sell para contar voto direcional
  min_confidence_weight: 0.20  # peso minimo do voto quando ha sinal direcional fraco
  moderate_pair_score: 2.0  # score base-cotada minimo para BUY/SELL moderado
  strong_pair_score: 4.0  # score base-cotada minimo para FORTE BUY/FORTE SELL
  timeframe_weights:  # pesos dos votos por timeframe
    M5: 0.50
    M15: 0.80
    M30: 1.00
    H1: 1.30
    H4: 1.60
    D1: 1.20
  false_neutral_detector:  # diagnostico shadow para neutros que talvez deveriam acompanhar o fluxo
    enabled: true
    mode: "shadow"  # apenas marca e registra; nao altera BUY/SELL automaticamente
    write_csv: true
    min_pair_score: 4.0  # exige divergencia forte entre moeda base e cotada
    min_aligned_timeframes: 2  # aceita 1 quando H1/H4/D1 esta alinhado com score forte
    structural_timeframes: ["H1", "H4", "D1"]  # confirmacao preferida para liberar falso neutro
    require_structural_for_short_tf: true  # M5/M15/M30 precisam de H1/H4/D1 alinhado
  directional_signal_guard:  # valida BUY/SELL contra o fluxo relativo das moedas
    enabled: true
    mode: "shadow"  # shadow registra conflito/confirmacao; block pode bloquear conflito forte
    write_csv: true
    min_confirm_score: 2.0  # score minimo para considerar sinal confirmado pelo fluxo
    min_conflict_score: 3.0  # score contrario minimo para marcar falso sinal provavel
    reason_code: "currency_strength_guard"

# Operational Target Matrix
operational_target_matrix:  # matriz diaria de alvo/stop/drawdown por ativo e direcao
  enabled: true
  mode: "shadow"  # shadow gera/carrega a matriz; block/apply pode ser ligado depois
  update_on_startup: false  # DESABILITADO: busca 5 dias de dados em startup, demora ~5min
  startup_mode: "background"  # background atualiza sem travar a subida; use blocking para esperar terminar
  output_dir: "reports/operational_target_matrix"
  lookback_days: 5
  lookahead_minutes: 240
  decision_filter: "ALLOW"
  market_time_offset_hours: 6
  min_samples: 10
  max_startup_seconds: 600
  targets: [5, 10, 15, 20, 25, 30, 40, 50]
  stops: [10, 15, 20, 25, 30, 40, 50, 70, 100]
  max_loss_streak: 4
  min_win_rate: 45.0
  use_mt5: true
  save_mt5_history: true
  latest_path: "reports/operational_target_matrix/operational_target_matrix_latest.json"

# OMS Runtime Snapshot
oms:  # snapshot do estado operacional em memoria
  snapshot_enabled: true  # gera snapshot do OMS para dashboard/auditoria
  snapshot_dir: "logs/oms"  # diretorio dos snapshots do OMS
  trade_history_lookback_hours: 24  # janela de historico de trades em horas

# Asset Contract Overrides
contracts:  # contratos e aliases especiais por ativo
  overrides:  # sobrescritas de contrato por simbolo
    GOLD:  # secao de configuracao: GOLD
      broker_symbol: GOLD  # simbolo usado pela corretora
      asset_type: metal  # tipo do ativo para regras especiais

# Signal Thresholds
signal:  # thresholds minimos para transformar probabilidade em sinal
  buy_threshold: 0.60  # probabilidade minima para sinal de compra
  sell_threshold: 0.60  # probabilidade minima para sinal de venda
  confidence_filter: 0.50  # confianca minima para aceitar sinal
  min_signal_strength: 0.30  # forca minima do sinal
  invert_signals: false  # inverte sinais de compra/venda quando true
  inverted_signal_groups:  # inversao seletiva por ativo/timeframe para teste controlado
    []

# Signal Overrides
signal_overrides:  # correcoes pontuais/temporarias sem retreinar modelo
  enabled: true
  # Exemplo seguro:
  # rules:
  #   - symbol: "ETHUSD"
  #     timeframe: "M30"
  #     action: "block_buy"
  #     reason: "pullback_m30_contra_h1_h4_sell"
  #     valid_until: "2026-05-29T23:59:00-03:00"
  #
# Acoes suportadas:
  # force_wait, block_buy, block_sell, force_buy, force_sell, invert, reduce_confidence
  rules:
    - symbol: "EURCHF"
      timeframe: "H4"
      action: "force_buy"
      reason: "block_quality_relax_20260603_eurchf_h4_buy"
      valid_until: "2026-06-10T23:59:00-03:00"
    - symbol: "AUDNZD"
      timeframe: "H4"
      action: "force_buy"
      enabled: false
      reason: "block_quality_relax_20260603_audnzd_h4_buy"
      valid_until: "2026-06-10T23:59:00-03:00"
    - symbol: "GBPJPY"
      timeframe: "H1"
      action: "force_buy"
      reason: "block_quality_relax_20260603_gbpjpy_h1_buy"
      valid_until: "2026-06-10T23:59:00-03:00"
    - symbol: "GBPJPY"
      timeframe: "M30"
      action: "force_buy"
      reason: "block_quality_relax_20260603_gbpjpy_m30_buy"
      valid_until: "2026-06-10T23:59:00-03:00"
    - symbol: "EURJPY"
      timeframe: "H4"
      action: "force_sell"
      reason: "block_quality_relax_20260603_eurjpy_h4_sell"
      valid_until: "2026-06-10T23:59:00-03:00"
    - symbol: "EURGBP"
      timeframe: "H4"
      action: "force_sell"
      reason: "block_quality_relax_20260603_eurgbp_h4_sell"
      valid_until: "2026-06-10T23:59:00-03:00"

# Entry Filters
entry_filters:  # camadas de filtros antes da ordem
  swap_filter:
    enabled: false
    mode: "disabled"
    prefer_positive: false
    block_negative: false
    negative_block_threshold: 0.0
    min_swap_to_prefer: 0.0
    min_swap_to_allow: 0.0
    reason_code: "swap_filter_disabled"
    log_each_check: false
  historical_price_acceptance:  # valida se o preco atual permanece coerente com o dominio historico recente
    enabled: true
    mode: "shadow"  # shadow registra apenas; evita bloqueio duro salvo em strict_mode=block
    strict_mode: "soft"  # soft aceita needs_validation; block bloqueia quando o dominio historico falha
    reason_code: "historical_price_acceptance"
    lookback_bars: 80
    min_domain_quality: 0.10
    tolerance_pct: 0.05
    log_each_check: false
  historical_decision:  # integracao do gate de decisao historica (perfil + recencia + MTF)
    enabled: true
    mode: "shadow"  # shadow registra apenas por padrao; mude para block para bloquear ordens
    strict_mode: "soft"
    reason_code: "historical_decision"
    lookback_bars: 80
    min_domain_quality: 0.10
    log_each_check: false
  daytrade_relaxation:  # relaxa filtros macro/contexto para sinais muito fortes em M5/M15/M30
    enabled: true
    timeframes: ["M5", "M15", "M30"]
    strong_signal_edge: 0.10
    relax_filters: ["market_alignment", "macro_flow", "context_brain", "timeframe_consensus", "market_structure", "volatility_engine", "execution_engine", "entry_timing", "opportunity_engine", "portfolio_correlation"]
  trend_direction_guard:  # bloqueia apenas entradas que contrariam a tendência dominante, sem endurecer demais o resto
    enabled: true
    mode: "block"
    bars: 120
    ema_fast: 21
    ema_slow: 50
    timeframes: ["M15", "H1", "H4"]
    log_each_check: false
    reason_code: "trend_direction_guard"
  market_alignment:  # sincroniza sinal do modelo com fluxo multi-timeframe real sem inverter automaticamente
    enabled: true  # liga/desliga esta camada ou recurso
    mode: "shadow"  # shadow registra; block impede ordem contra fluxo/chop para daytrade
    reason_code: "market_alignment"  # codigo usado no motivo de bloqueio
    log_each_check: true  # registra cada avaliacao no log do robo
    write_monitor_log: true  # grava CSV em reports/market_alignment
    block_states: ["countertrend", "structural_conflict"]  # estados que bloqueiam em mode=block
    min_alignment_score: 0.10  # score minimo ponderado para aceitar direcao
    min_structural_score: 0.06  # score minimo H4/D1 na direcao do sinal
    chop_abs_score: 0.08  # abaixo disso considera sem fluxo claro
    require_h1_or_h4_alignment: true  # exige H1 ou H4 alinhado com o sinal
    block_lower_tf_against_h4_d1: true  # M5/M15/M30 contra H4/D1 vira pullback/bloqueio
    timeframe_weights:  # pesos da leitura de mercado por timeframe
      M5: 0.50  # peso/valor usado no calculo desta camada
      M15: 0.75  # peso/valor usado no calculo desta camada
      M30: 1.00  # peso/valor usado no calculo desta camada
      H1: 1.50  # peso/valor usado no calculo desta camada
      H4: 2.50  # peso/valor usado no calculo desta camada
      D1: 3.00  # peso/valor usado no calculo desta camada
  timeframe_consensus:  # consenso ponderado das previsoes do proprio Fusion entre timeframes
    enabled: true  # liga/desliga esta camada ou recurso
    mode: "shadow"  # shadow registra; block impede ordem contra consenso ponderado
    reason_code: "timeframe_consensus"  # codigo usado no motivo de bloqueio
    log_each_check: true  # registra divergencias no log do robo
    block_states: ["counter_consensus", "structural_conflict"]  # estados que bloqueiam em mode=block
    wait_edge: 0.08  # abaixo desta diferenca p_buy-p_sell considera WAIT
    min_valid_timeframes: 2  # minimo de timeframes com probabilidade valida para bloquear
    min_consensus_score: 0.10  # consenso minimo ponderado na direcao do sinal
    min_structural_score: 0.06  # consenso minimo H4/D1 na direcao do sinal
    require_h1_or_h4_alignment: true  # exige H1 ou H4 alinhado com o sinal
    block_lower_tf_against_h4_d1: true  # M5/M15/M30 contra H4/D1 vira conflito/pullback
    timeframe_weights:  # pesos por timeframe no consenso de previsoes
      M5: 0.50  # peso/valor usado no calculo desta camada
      M15: 0.75  # peso/valor usado no calculo desta camada
      M30: 1.00  # peso/valor usado no calculo desta camada
      H1: 1.50  # peso/valor usado no calculo desta camada
      H4: 2.50  # peso/valor usado no calculo desta camada
      D1: 3.00  # peso/valor usado no calculo desta camada
  session_context:  # filtro de sessao, liquidez e horario
    enabled: true  # liga/desliga esta camada ou recurso
    mode: "block"  # modo de operacao do filtro: shadow registra, block bloqueia
    low_liquidity_start_hour_utc: 21  # inicio UTC da janela de baixa liquidez
    low_liquidity_end_hour_utc: 23  # fim UTC da janela de baixa liquidez
    asian_start_hour_utc: 0  # inicio UTC da sessao asiatica
    asian_end_hour_utc: 7  # fim UTC da sessao asiatica
    london_start_hour_utc: 7  # inicio UTC da sessao Londres
    london_end_hour_utc: 16  # fim UTC da sessao Londres
    new_york_start_hour_utc: 12  # inicio UTC da sessao Nova York
    new_york_end_hour_utc: 21  # fim UTC da sessao Nova York
    london_open_risk_minutes: 20  # janela de risco na abertura de Londres
    new_york_open_risk_minutes: 20  # janela de risco na abertura de Nova York
    transition_risk_minutes: 15  # janela de risco em transicoes de sessao
    friday_cutoff_hour_utc: 18  # horario UTC para reduzir risco na sexta
    scalping_timeframes: ["M5", "M15"]  # timeframes tratados como scalping
    asia_preferred_currencies: ["JPY", "AUD", "NZD", "SGD"]  # moedas preferidas na sessao asiatica
    london_preferred_currencies: ["EUR", "GBP", "CHF"]  # moedas preferidas na sessao Londres
    new_york_preferred_currencies: ["USD", "CAD", "XAU"]  # moedas preferidas na sessao Nova York
    high_noise_symbols: ["GOLD", "GBPJPY", "GBPNZD", "AUDSGD", "NZDSGD"]  # ativos com maior ruido operacional
    session_scores:  # pontuacao por tipo de sessao
      london_new_york_overlap: 0.90  # peso/valor usado no calculo desta camada
      london: 0.82  # peso/valor usado no calculo desta camada
      new_york: 0.80  # peso/valor usado no calculo desta camada
      asia: 0.62  # peso/valor usado no calculo desta camada
      off_session: 0.50  # peso/valor usado no calculo desta camada
      rollover_low_liquidity: 0.30  # peso/valor usado no calculo desta camada
      weekend: 0.10  # peso/valor usado no calculo desta camada
      friday_close_risk: 0.25  # peso/valor usado no calculo desta camada
    log_each_check: false  # true registra cada checagem; aumenta volume de logs
  market_regime:  # motor de regime de mercado
    enabled: true  # liga/desliga esta camada ou recurso
    mode: "shadow"  # modo de operacao do filtro: shadow registra, block bloqueia
    bars: 260  # quantidade de candles usados no calculo
    atr_period: 14  # periodo do ATR
    long_window: 100  # janela longa de calculo
    adx_period: 14  # periodo do ADX
    efficiency_window: 20  # janela de eficiencia direcional
    entropy_window: 30  # janela de entropia
    compression_threshold: 0.75  # limiar de compressao de volatilidade
    expansion_threshold: 1.25  # limiar de expansao de volatilidade
    trend_adx_threshold: 22.0  # ADX minimo para regime de tendencia
    range_adx_threshold: 16.0  # ADX maximo para regime de range
    panic_atr_percentile: 0.95  # percentil de ATR para panico
    log_each_check: false  # true registra cada checagem; aumenta volume de logs
  volatility_engine:  # motor de volatilidade e anomalias
    enabled: true  # liga/desliga esta camada ou recurso
    mode: "block"  # modo de operacao do filtro: shadow registra, block bloqueia
    block_states: ["PANIC_VOLATILITY"]  # estados que bloqueiam ordem quando mode=block
    bars: 180  # quantidade de candles usados no calculo
    atr_period: 14  # periodo do ATR
    short_window: 20  # janela curta de calculo
    long_window: 100  # janela longa de calculo
    compression_threshold: 0.75  # limiar de compressao de volatilidade
    expansion_threshold: 1.25  # limiar de expansao de volatilidade
    panic_percentile: 0.95  # percentil usado para classificar panico
    min_range_to_atr: 0.55  # range minimo relativo ao ATR
    log_each_check: false  # true registra cada checagem; aumenta volume de logs
  macro_flow:  # filtro de fluxo macro dominante
    enabled: true  # liga/desliga esta camada ou recurso
    mode: "shadow"  # modo de operacao do filtro: shadow registra, block bloqueia
    aggregation: "weighted_majority"  # metodo de agregacao do score
    timeframes: ["H1", "H4", "D1"]  # timeframes usados nesta regra
    bars: 260  # quantidade de candles usados no calculo
    ema_fast: 21  # periodo da EMA rapida
    ema_slow: 50  # periodo da EMA lenta
    atr_period: 14  # periodo do ATR
    momentum_bars: 20  # janela de momentum em candles
    min_score: 0.20  # score minimo exigido
    weights:  # pesos usados no calculo composto
      H1: 1.0  # peso/valor usado no calculo desta camada
      H4: 1.5  # peso/valor usado no calculo desta camada
      D1: 2.0  # peso/valor usado no calculo desta camada
    by_signal_timeframe:  # timeframes macro usados por timeframe do sinal
      M5:  # secao de configuracao: M5
        timeframes: ["H1", "H4", "D1"]  # timeframes usados nesta regra
        weights: {H1: 1.0, H4: 1.5, D1: 2.0}  # parametro de configuracao: weights
      M15:  # secao de configuracao: M15
        timeframes: ["H1", "H4", "D1"]  # timeframes usados nesta regra
        weights: {H1: 1.0, H4: 1.5, D1: 2.0}  # parametro de configuracao: weights
      M30:  # secao de configuracao: M30
        timeframes: ["H1", "H4", "D1"]  # timeframes usados nesta regra
        weights: {H1: 1.0, H4: 1.5, D1: 2.0}  # parametro de configuracao: weights
      H1:  # secao de configuracao: H1
        timeframes: ["H4", "D1"]  # timeframes usados nesta regra
        weights: {H4: 1.5, D1: 2.0}  # parametro de configuracao: weights
      H4:  # secao de configuracao: H4
        timeframes: ["D1"]  # timeframes usados nesta regra
        weights: {D1: 2.0}  # parametro de configuracao: weights
      D1:  # secao de configuracao: D1
        timeframes: ["D1"]  # timeframes usados nesta regra
        weights: {D1: 2.0}  # parametro de configuracao: weights
    currency_strength:  # componente de forca relativa das moedas
      enabled: true  # liga/desliga esta camada ou recurso
      weight: 0.35  # peso deste componente
      min_score: 0.05  # score minimo exigido
    log_each_check: true  # true registra cada checagem; aumenta volume de logs
    reason_code: "macro_fluxo_contra"  # codigo de motivo usado em logs/dashboard
  portfolio_correlation:  # filtro de correlacao com posicoes abertas
    enabled: true  # liga/desliga esta camada ou recurso
    mode: "block"  # modo de operacao do filtro: shadow registra, block bloqueia
    matrix_path: "reports/correlation/correlation_matrix_H1.json"  # arquivo da matriz de correlacao
    min_abs_correlation: 0.65  # correlacao absoluta minima para acionar regra
    min_loss_money: 0.50  # prejuizo minimo para filtro de correlacao
    position_scope: "all"  # escopo das posicoes consideradas
    log_passed_filter: false  # registra tambem filtros aprovados
    block_same_risk_direction: true  # bloqueia riscos equivalentes na mesma direcao
    reason_code: "correlacao_prejuizo"  # codigo de motivo usado em logs/dashboard
    reversal_relief:  # alivio quando posicao perdedora mostra reversao
      enabled: true  # liga/desliga esta camada ou recurso
      # Se a posicao perdedora mostrar recuperacao em M5/M15, a correlacao deixa de bloquear.
      mode: "allow"  # modo de operacao do filtro: shadow registra, block bloqueia
      timeframes: ["M5", "M15"]  # timeframes usados nesta regra
      min_confirmations: 2  # confirmacoes minimas exigidas
      require_candle_confirmation: true  # exige confirmacao por candle
      require_ema_alignment: true  # exige alinhamento de EMAs
  portfolio_exposure:  # controle de exposicao global e por moeda
    enabled: true  # liga/desliga esta camada ou recurso
    mode: "allow"  # modo de operacao do filtro: shadow registra, block bloqueia
    block_states: ["symbol_concentration", "currency_overexposure", "gross_overexposure", "cluster_overexposure", ""]  # estados que bloqueiam ordem quando mode=block
    position_scope: "all"  # escopo das posicoes consideradas
    max_currency_exposure: 2.0  # exposicao maxima por moeda
    max_projected_currency_exposure: 2.5  # exposicao maxima projetada apos nova ordem
    max_cluster_exposure: 3.0  # exposicao maxima por cluster correlacionado
    warning_cluster_exposure: 2.0  # alerta de exposicao por cluster
    correlation_threshold: 0.65  # limiar de correlacao para clusters
    warning_currency_exposure: 1.5  # alerta de exposicao por moeda
    max_gross_exposure: 6.0  # exposicao bruta maxima total
    warning_gross_exposure: 4.0  # alerta de exposicao bruta
