  min_direction_score: 0.60  # probabilidade minima na direcao da ordem para evitar sinal fraco
  macro_alignment_guard_enabled: true  # bloqueia quando macro_flow e market_alignment estao contra sem score forte
  macro_alignment_min_tradeability: 0.60  # tradeability minima para aceitar macro+estrutura contra
  macro_alignment_min_consensus: 0.45  # consenso minimo para aceitar macro+estrutura contra
  losing_positions_guard_enabled: true  # exige oportunidade forte quando ja ha posicoes negativas
  losing_positions_min_tradeability: 0.68  # score minimo com carteira ja negativa
  extreme_breakout_guard_enabled: true  # exige confirmacao forte para compra em topo/venda em fundo por breakout/BOS
  extreme_breakout_min_tradeability: 0.68  # tradeability minima para breakout em extremo
  extreme_breakout_min_consensus: 0.55  # consenso minimo para breakout em extremo
  stale_data_guard_enabled: true  # bloqueia sinais com feed/candle marcado como desatualizado
  fragile_structure_guard_enabled: true  # bloqueia estrutura em shadow fraca sem confirmacao forte
  fragile_structure_min_tradeability: 0.70  # tradeability minima com estrutura shadow fraca
  fragile_structure_min_consensus: 0.50  # consenso minimo com estrutura shadow fraca
  xai_enabled: true  # habilita explicabilidade da decisao
  xai_top_factors: 8  # quantidade de fatores XAI exibidos
  historical_enabled: false  # habilita o uso do gate historico de decisao (false por padrao)

# Offline AI reviewer for Decision Audit.
# Nao altera configuracao automaticamente; apenas gera logs e relatorios de revisao.
